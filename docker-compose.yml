# docker-compose.yml
services:
  nexus-tuner:
    # Use the image you built and pushed to the GitHub Container Registry.
    # Docker will automatically pull the 'latest' tag if it's not available locally.
    image: ghcr.io/fahmula/nexus-tuner:latest
    container_name: nexus-tuner
    
    # Ensures the container restarts automatically if it crashes or the server reboots,
    # unless you explicitly stop it yourself.
    restart: unless-stopped

    # Maps a port on your host machine to the container's internal port.
    # The format is "HOST_PORT:CONTAINER_PORT".
    # The application inside the container runs on port 4040 (NEXUS_PORT in .env file)
    # This example maps port 4040 on your host to port 4040 in the container.
    # You can change 4040 to any other available port on your host (e.g., "1234:4040").
    environment:
      - NEXUS_PORT=4040
    ports:
      - 4040:4040
      
    volumes:
      # This is crucial for data persistence. It maps the local './config' directory
      # on your host to the '/config' directory inside the container.
      # This ensures your JSON configuration files are not lost if the container is removed.
      - /path/to/config/folder:/config