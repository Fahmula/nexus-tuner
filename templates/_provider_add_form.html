<div class="card card-body mb-3">
    <form hx-post="{{ url_for('ui_provider_add') }}"
          hx-target="#providers-table-body"
          hx-swap="afterbegin"
          hx-on::after-request="this.reset(); if(event.detail.successful) { document.getElementById('add-provider-form-container').innerHTML = ''; }">
        <div class="row g-2 align-items-end">
            <div class="col-md-4">
                <label for="alias" class="form-label visually-hidden">Alias (ID)</label>
                <input type="text" class="form-control" id="alias" name="alias" placeholder="Provider Alias (e.g., myiptv)"
                       value="{{ alias if alias is not none else '' }}" required>
            </div>
            <div class="col-md-5">
                <label for="url" class="form-label visually-hidden">M3U URL</label>
                <input type="url" class="form-control" id="url" name="url" placeholder="M3U URL (e.g., http://example.com/playlist.m3u)"
                       value="{{ url if url is not none else '' }}" required>
            </div>
            <div class="col-md-2">
                <label for="max_concurrent_streams" class="form-label visually-hidden">Max Streams</label>
                <input type="number" class="form-control" id="max_concurrent_streams" name="max_concurrent_streams" placeholder="Max Streams"
                       value="{{ max_concurrent_streams if max_concurrent_streams is not none else 1 }}" min="1" required>
            </div>
            <div class="col-md-1 text-end">
                <button type="submit" class="btn btn-primary w-100" title="Add Provider">
                    <i class="fas fa-plus"></i>
                </button>
                <button type="button" class="btn btn-outline-secondary w-100 mt-1" title="Cancel"
                        hx-on:click="document.getElementById('add-provider-form-container').innerHTML = '';">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </form>
</div>
