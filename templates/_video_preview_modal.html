<div class="modal fade" id="previewModal" tabindex="-1" aria-labelledby="previewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="previewModalLabel">
                    <img id="previewModalLogo" src="{{ tvg_logo }}" alt="logo"
                            style="max-height:20px; max-width:40px;" class="me-2 align-middle"
                            onerror="this.style.display='none'" loading="lazy">
                    <span id="previewModalTitleText">Stream Preview</span>
                    <small id="previewModalSourceId" class="text-muted ms-2"></small>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="preview-modal-body">
                <div class="text-center">
                    <div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
