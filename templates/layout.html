<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="htmx-config" content='{"logLevel": "debug"}'>
    <title>{% block title %}NexusStream{% endblock %}</title>

    <script>
        // Immediately-invoked function to set the theme on initial load to prevent FOUC.
        (() => {
            const getStoredTheme = () => localStorage.getItem('theme');
            const getPreferredTheme = () => {
                const storedTheme = getStoredTheme();
                if (storedTheme) {
                    return storedTheme;
                }
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            };
            const setTheme = theme => {
                document.documentElement.setAttribute('data-bs-theme', theme);
            };
            setTheme(getPreferredTheme());
        })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
          integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { padding-top: 3.5rem; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline; }
        .htmx-request.htmx-indicator { display: inline; }
        .table-responsive { margin-top: 1rem; }
        .card { margin-bottom: 1.5rem; }

         /* Custom Orange Badge Style --- */
        .bg-orange {
            background-color: #fd7e14 !important;
            color: #fff !important;
        }

        /* Custom styles for the top status bar */
        #provider-status-bar {
            padding: 0.25rem 0;
            background-color: var(--bs-body-bg); /* Match body background */
            border-bottom: 1px solid var(--bs-border-color-translucent);
            position: sticky;
            top: 3.5rem; /* Height of the fixed navbar */
            z-index: 1020; /* Below navbar (1030) but above other content */
        }

        /* --- Theme Toggle Button Icons --- */
        #theme-toggle-button .fa-sun { display: none; }
        #theme-toggle-button .fa-moon { display: inline-block; }

        [data-bs-theme="dark"] #theme-toggle-button .fa-sun { display: inline-block; }
        [data-bs-theme="dark"] #theme-toggle-button .fa-moon { display: none; }

        /* Hide the button during HTMX requests */
        #analyze-button-container.htmx-request #analyze-button {
        display: none;
        }
        /* Position the spinner where the button was */
        #analyze-button-container.htmx-request #spinner {
            display: inline-block;
            padding: 8px 16px;
        }

        /* --- Custom Dark Mode Overrides --- */
        /* Style for the "Quick Actions" box */
        [data-bs-theme="dark"] .bg-white {
            background-color: var(--bs-body-bg) !important;
        }

        /* Override dashboard card colors for dark mode */
        [data-bs-theme="dark"] .card.bg-primary,
        [data-bs-theme="dark"] .card.bg-success,
        [data-bs-theme="dark"] .card.bg-info,
        [data-bs-theme="dark"] .card.bg-warning {
            background-color: var(--bs-tertiary-bg) !important;
            border-color: var(--bs-border-color-translucent) !important;
            color: var(--bs-body-color) !important; /* Overrides .text-white */
        }

        /* Style card headers for a slightly different look */
        [data-bs-theme="dark"] .card.bg-primary .card-header,
        [data-bs-theme="dark"] .card.bg-success .card-header,
        [data-bs-theme="dark"] .card.bg-info .card-header,
        [data-bs-theme="dark"] .card.bg-warning .card-header {
            background-color: var(--bs-secondary-bg);
            color: var(--bs-emphasis-color);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('ui_main_dashboard') }}">NexusStream</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
                    aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'ui_main_dashboard' %}active{% endif %}" aria-current="page" href="{{ url_for('ui_main_dashboard') }}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'ui_providers_manage' %}active{% endif %}" href="{{ url_for('ui_providers_manage') }}">Providers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'ui_source_services_list' %}active{% endif %}" href="{{ url_for('ui_source_services_list') }}">Source Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'ui_logical_channels_list' or request.endpoint == 'ui_logical_channel_edit' or request.endpoint == 'ui_logical_channel_add' %}active{% endif %}" href="{{ url_for('ui_logical_channels_list') }}">Logical Channels</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link"
                        href="#"
                        hx-get="/ui/logs/modal"
                        hx-target="#modal-log-content"
                        data-bs-toggle="modal"
                        data-bs-target="#modal-logs">
                        Logs
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <!-- Dark Mode Toggle Button -->
                    <button class="btn btn-outline-light me-2" type="button" id="theme-toggle-button" title="Toggle theme">
                        <i class="fas fa-moon"></i>
                        <i class="fas fa-sun"></i>
                    </button>

                    <form class="d-flex" role="search"
                          hx-post="{{ url_for('reload_configuration') }}"
                          hx-target="#flash-messages-container"
                          hx-swap="innerHTML"
                          hx-indicator="#reload-indicator">
                        <button class="btn btn-outline-light" type="submit">
                            <i class="fas fa-sync-alt"></i> Reload Config
                            <span id="reload-indicator" class="htmx-indicator spinner-border spinner-border-sm ms-1" role="status" aria-hidden="true"></span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid"
         id="provider-status-bar"
         hx-get="{{ url_for('ui_provider_status') }}"
         hx-trigger="load, every 1s"
         hx-swap="innerHTML">
        <span class="text-muted small">Loading provider status...</span>
    </div>

    <main class="container mt-4 mb-5">
        <div id="flash-messages-container" hx-trigger="flashMessagesUpdated from:body" hx-get="{{ url_for('ui_flash_messages') }}" hx-swap="innerHTML">
            {% include "_flash_messages.html" %}
        </div>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer mt-auto py-3 bg-body-tertiary border-top">
        <div class="container text-center">
            <span class="text-muted">NexusStream v{{ app_version }} © {{ now.year }}</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>
    <script>
        document.body.addEventListener('htmx:afterSwap', function (event) {
            document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (tooltipEl) {
                if (!tooltipEl.hasAttribute('data-tooltip-initialized')) {
                    new bootstrap.Tooltip(tooltipEl, {
                        trigger: 'hover focus'
                    });
                    tooltipEl.setAttribute('data-tooltip-initialized', 'true');
                }
            });
        });

        // Event listener for the theme toggle button
        document.getElementById('theme-toggle-button').addEventListener('click', () => {
            const htmlEl = document.documentElement;
            const currentTheme = htmlEl.getAttribute('data-bs-theme');
            // Determine the new theme and save it to localStorage
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            htmlEl.setAttribute('data-bs-theme', newTheme);
        });
    </script>
    {% block extra_js %}{% endblock %}
    <div id="modal-logs" class="modal fade" tabindex="-1" aria-labelledby="modal-logs-label" aria-hidden="true">
        <div id="modal-log-content" class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable" role="document">
            <!-- HTMX will load the modal's content here -->
            <div class="modal-content">
                <div class="modal-body">
                    Loading logs...
                </div>
            </div>
        </div>
    </div>
</body>
</html>
