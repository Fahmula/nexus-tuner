<tr id="wishlist-channel-{{ old_channel_name | replace(' ', '-') }}">
    <td colspan="2">
        <form hx-put="{{ url_for('ui_wishlist_edit', old_channel_name=old_channel_name) }}"
              hx-target="closest tr"
              hx-swap="outerHTML">
            <div class="input-group input-group-sm">
                <input type="text" class="form-control" name="channel_name"
                       value="{{ new_channel_name if new_channel_name is not none else old_channel_name }}" required>
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-check"></i> Save
                </button>
                <button type="button" class="btn btn-outline-secondary"
                        hx-get="{{ url_for('ui_wishlist_manage') }}"
                        hx-target="closest tr"
                        hx-swap="outerHTML">
                    <i class="fas fa-times"></i> Cancel
                </button>
            </div>
        </form>
    </td>
</tr>
