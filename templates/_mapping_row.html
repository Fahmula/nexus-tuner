<div class="row gx-2 mb-2 mapping-row" id="mapping-row-{{ current_row_index }}">
    <div class="col-7">
        <select class="form-select form-select-sm"
                name="mapping_service_id_{{ current_row_index }}"
                aria-label="Select service for row {{ current_row_index }}"
                required>
            <option value="" {% if not mapping or not mapping.service_id %}selected{% endif %} disabled>Select a service...</option>

            {% set filter_query = channel.display_name | lower if channel.display_name else "" %}

            {% for service in all_services %}

                {% set service_search_text = service.original_tvg_name | lower if service.original_tvg_name else "" %}

                {% if not filter_query or (filter_query and filter_query in service_search_text) %}
                    <option value="{{ service.id }}"
                            {% if mapping and mapping.source_service_id and mapping.source_service_id == service.id %}selected{% endif %}>
                        {{ service.original_tvg_name }} {{ service.provider_alias }}
                    </option>
                {% endif %}
            {% endfor %}
        </select>
    </div>

     <div class="col-3">
        <input type="number" class="form-control form-control-sm" 
               name="mapping_priority_{{ current_row_index }}"
               value="{{ mapping.priority if mapping else 0 }}" placeholder="Prio" min="0" required>
    </div>

    <div class="col-2 text-end">
        <button type="button" class="btn btn-sm btn-outline-danger remove-mapping-row-btn"
                hx-delete="{{ url_for('ui_remove_mapping_row_placeholder') }}" {# Consider passing row_id if server needs it #}
                hx-target="closest .mapping-row"
                hx-swap="outerHTML"
                hx-confirm="Remove this mapping row?"
                title="Remove this mapping row">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
</div>
