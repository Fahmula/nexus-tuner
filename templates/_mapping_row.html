<div class="row gx-2 mb-2 mapping-row" id="mapping-row-{{ current_row_index }}">
    <div class="col-7">
        <select class="form-select form-select-sm"
                name="mapping_service_id"
                aria-label="Select service for row {{ current_row_index }}">
            <option value="" {% if not mapping %}selected{% endif %}>Select a service...</option>

            {# First, check if there's an existing mapping that we need to ensure is in the list #}
            {% set current_service_id = mapping.source_service_id if mapping else None %}
            {% set current_service_in_suggestions = False %}

            {% for service in suggested_services %}
                {% if service.id == current_service_id %}
                    {% set current_service_in_suggestions = True %}
                {% endif %}
                <option value="{{ service.id }}" {% if service.id == current_service_id %}selected{% endif %}>
                    {{ service.original_tvg_name }} ({{ service.provider_alias }})
                </option>
            {% endfor %}
            
            {# If the currently selected service was NOT in the suggestions, add it to the top #}
            {# This prevents it from disappearing if the user changes the display name #}
            {% if current_service_id and not current_service_in_suggestions %}
                {% set mapped_service = all_services | selectattr('id', 'equalto', current_service_id) | first %}
                {% if mapped_service %}
                    <option value="{{ mapped_service.id }}" selected>
                        {{ mapped_service.original_tvg_name }} ({{ mapped_service.provider_alias }})
                    </option>
                {% endif %}
            {% endif %}

        </select>
    </div>

     <div class="col-3">
        <input type="number" class="form-control form-control-sm" 
               name="mapping_priority"
               value="{{ mapping.priority if mapping else 0 }}" placeholder="Priority" min="0" required>
    </div>

    <div class="col-2 text-end">
        <button type="button" class="btn btn-sm btn-outline-danger remove-mapping-row-btn"
                hx-delete="{{ url_for('ui_remove_mapping_row_placeholder') }}"
                hx-target="closest .mapping-row"
                hx-swap="outerHTML"
                hx-confirm="Remove this mapping row?"
                title="Remove this mapping row">
            <i class="fas fa-times"></i>
        </button>
    </div>
</div>
