<div class="card card-body mb-3">
    <form hx-post="{{ url_for('ui_wishlist_add') }}"
          hx-target="#wishlist-channels-table-body"
          hx-swap="afterbegin"
          hx-on::after-request="this.reset(); if(event.detail.successful) { document.getElementById('add-wishlist-form-container').innerHTML = ''; }">
        <div class="input-group">
            <input type="text" class="form-control" name="channel_name" placeholder="Enter new channel name"
                   value="{{ channel_name if channel_name is not none else '' }}" required>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-plus"></i> Add Channel
            </button>
            <button type="button" class="btn btn-outline-secondary"
                    hx-on:click="document.getElementById('add-wishlist-form-container').innerHTML = '';">
                <i class="fas fa-times"></i> Cancel
            </button>
        </div>
    </form>
</div>
