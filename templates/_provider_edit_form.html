<tr id="provider-{{ provider.alias | replace(' ', '-') }}" hx-target="this" hx-swap="outerHTML">
    <td colspan="4">
        <div class="alert alert-warning small mb-2 d-flex align-items-start" role="alert">
            <i class="fas fa-exclamation-triangle me-2 mt-1"></i>
            <div>Edits will stop all active streams for this provider on save.</div>
        </div>
        <form hx-put="{{ url_for('ui_provider_edit', alias=provider.alias) }}"
              hx-target="closest tr"
              hx-swap="outerHTML">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label for="edit-alias-{{ provider.alias }}" class="form-label visually-hidden">Provider ID</label>
                    <input type="text" class="form-control form-control-sm" id="edit-alias-{{ provider.alias }}" name="alias"
                           value="{{ provider.alias }}" readonly title="Alias is read-only.">
                </div>
                <div class="col-md-5">
                    <label for="edit-m3u_url-{{ provider.alias }}" class="form-label visually-hidden">M3U URL</label>
                    <input type="url" class="form-control form-control-sm" id="edit-m3u_url-{{ provider.alias }}" name="m3u_url"
                           value="{{ provider.m3u_url }}" required>
                </div>
                <div class="col-md-2">
                    <label for="edit-max-streams-{{ provider.alias }}" class="form-label visually-hidden">Max Streams</label>
                    <input type="number" class="form-control form-control-sm" id="edit-max-streams-{{ provider.alias }}" name="max_streams"
                           value="{{ provider.max_streams }}" min="0" required>
                </div>
                <div class="col-md-1 text-end">
                    <button type="submit" class="btn btn-success btn-sm w-100" title="Save Changes">
                        <i class="fas fa-check"></i>
                    </button>
                    <button type="button" class="btn btn-outline-secondary btn-sm w-100 mt-1" title="Cancel"
                            hx-get="{{ url_for('ui_provider_edit', alias=provider.alias, cancel='true') }}">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
        </form>
    </td>
</tr>
