<tr id="provider-{{ provider.alias | replace(' ', '-') }}" hx-target="this" hx-swap="outerHTML">
    <td colspan="5">
        <form hx-put="{{ url_for('ui_provider_edit', alias=provider.alias) }}"
              hx-target="closest tr"
              hx-swap="outerHTML">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label for="edit-alias-{{ provider.alias }}" class="form-label visually-hidden">Alias (ID)</label>
                    <input type="text" class="form-control form-control-sm" id="edit-alias-{{ provider.alias }}" name="alias"
                           value="{{ provider.alias }}" readonly title="Alias is read-only.">
                </div>
                <div class="col-md-5">
                    <label for="edit-url-{{ provider.alias }}" class="form-label visually-hidden">M3U URL</label>
                    <input type="url" class="form-control form-control-sm" id="edit-url-{{ provider.alias }}" name="url"
                           value="{{ provider.url }}" required>
                </div>
                <div class="col-md-2">
                    <label for="edit-max-streams-{{ provider.alias }}" class="form-label visually-hidden">Max Streams</label>
                    <input type="number" class="form-control form-control-sm" id="edit-max-streams-{{ provider.alias }}" name="max_concurrent_streams"
                           value="{{ provider.max_concurrent_streams }}" min="1" required>
                </div>
                <div class="col-md-1 text-end">
                    <button type="submit" class="btn btn-success btn-sm w-100" title="Save Changes">
                        <i class="fas fa-check"></i>
                    </button>
                    <button type="button" class="btn btn-outline-secondary btn-sm w-100 mt-1" title="Cancel"
                            hx-get="{{ url_for('ui_provider_edit', alias=provider.alias, cancel='true') }}">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
        </form>
    </td>
</tr>
