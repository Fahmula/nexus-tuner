{% if ok %}
    <span class="badge bg-success"><i class="fas fa-check-circle me-1"></i>OK</span>
{% else %}
    <span class="badge bg-danger"><i class="fas fa-times-circle me-1"></i>Failed</span>
{% endif %}
<span class="small text-muted ms-1">{{ message }}</span>
{% if checked_at %}
    <span class="small text-muted">({{ checked_at.strftime("%H:%M:%S") }})</span>
{% endif %}
