name: Manual Release and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Optional: Force a release bump (major, minor, patch). Let semantic-release decide if blank.'
        required: false
        type: choice
        options:
          - ''
          - 'patch'
          - 'minor'
          - 'major'
      is_prerelease:
        description: 'Create a pre-release? (e.g., 2.0.0-rc.1)'
        required: true
        type: boolean
        default: false
      prerelease_channel:
        description: 'If pre-release, specify the channel (e.g., "rc", "beta", "alpha"). Default is "rc".'
        required: false
        default: 'rc'
      # NEW: The safe "Dry Run" toggle. Defaults to true.
      dry_run:
        description: 'Log what would happen without creating a real release. Uncheck to perform a live release.'
        required: true
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      issues: write 
      pull-requests: write
    outputs:
      # This output is only set on a LIVE run, which is key for the next job.
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch all history for semantic-release to analyze
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # This step installs all the plugins defined in your .releaserc.js file
      - name: Install Semantic Release plugins
        run: npm install semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/changelog @semantic-release/github @semantic-release/git

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          # Pass the dry_run input to the action
          dry_run: ${{ github.event.inputs.dry_run }}
        env:
          # These environment variables are read by your .releaserc.js file
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ github.event.inputs.is_prerelease }}
          PRERELEASE_CHANNEL: ${{ github.event.inputs.prerelease_channel }}
          FORCE_RELEASE_TYPE: ${{ github.event.inputs.release_type }}

  build-and-push:
    needs: release
    # CRITICAL: This 'if' condition ensures this job ONLY runs when a real release was made.
    # The 'new_release_version' output is empty during a dry run.
    if: needs.release.outputs.new_release_version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new_release_version }}

      - name: Convert GITHUB_REPOSITORY to lowercase
        run: echo "IMAGE_NAME=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(needs.release.outputs.new_release_version, '-') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}