name: Manual Release and Push Docker Image

# This workflow is now triggered manually from the GitHub Actions UI
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Optional: Force a release type (major, minor, or patch)'
        required: false
        type: choice
        options:
          - '' # This empty option allows semantic-release to decide automatically
          - 'patch'
          - 'minor'
          - 'major'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@users.noreply.github.com"

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        # This 'with' block is new. It uses the manual input if provided.
        with:
          semantic_version: 19 # Use a recent version of semantic-release
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This line forces a release type if you selected one in the UI
          SEMANTIC_RELEASE_RELEASE_TYPE: ${{ github.event.inputs.release_type }}

  build-and-push:
    needs: release 
    # This condition is still important. It only runs if the 'release' job actually created a version.
    if: ${{ needs.release.outputs.new_release_version != '' }} 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up repository
        # We check out the specific tag created by the release job to ensure we build the correct code
        uses: actions/checkout@v3
        with:
          ref: ${{ needs.release.outputs.new_release_version }}

      - name: Convert GITHUB_REPOSITORY to lowercase
        run: echo "IMAGE_NAME=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.release.outputs.new_release_version }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest